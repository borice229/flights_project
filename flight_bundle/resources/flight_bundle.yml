# A sample job for flight_bundle.

resources:
  jobs:
    flight_bundle:
      name: flight_bundle

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: notebook_task
          notebook_task:
            notebook_path: ../src/01_Ingestion_bronze.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
